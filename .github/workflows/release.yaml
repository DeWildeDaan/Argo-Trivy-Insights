name: release
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yaml
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      # Version comes from conventional commits; prepareCmd in .releaserc.json
      # injects it into package.json before building. No-op if nothing releasable.
      - run: npx -p semantic-release@25 -p @semantic-release/exec@7 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
